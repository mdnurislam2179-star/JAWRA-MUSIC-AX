<!DOCTYPE html>
<html lang="bn"><link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      minimum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>JAWRA MUSIC</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    min-height:100%;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:pan-x pan-y;
    overscroll-behavior-x:none;
}

body{
    margin:0;
    width:100%;
    min-height:100vh;
    background:#fff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
    touch-action:pan-x pan-y;
    overscroll-behavior-x:none;
    user-select:none;
    -webkit-user-select:none;
}

button,
input{
    font-family:inherit;
}


/* =====================================================
   SPLASH
===================================================== */

#splashScreen{
    position:fixed;
    inset:0;
    z-index:9999999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    animation:splashAutoHide .7s ease 2.2s forwards;
}

#splashScreen img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;

    animation:logoPulse 1.25s ease-in-out infinite;

    box-shadow:
        0 0 25px rgba(155,0,255,.8),
        0 0 70px rgba(100,0,255,.45);
}

@keyframes logoPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

@keyframes splashAutoHide{
    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}


/* =====================================================
   APP
===================================================== */

#app{
    width:100%;
    min-height:100vh;
    padding-bottom:82px;
}


/* =====================================================
   HOME HEADER
===================================================== */

.home-header{
    width:100%;
    padding:12px 14px 8px;

    background:rgba(255,255,255,.98);

    position:sticky;
    top:0;
    z-index:3000;

    border-bottom:1px solid #ededed;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.brand{
    text-align:center;
    font-size:24px;
    font-weight:900;
    letter-spacing:.5px;
    margin-bottom:11px;
}

.brand span{
    color:#7a00ff;
}


/* =====================================================
   HOME SEARCH
===================================================== */

.home-search-wrap{
    width:100%;
    display:flex;
    justify-content:center;
}

.home-search{
    width:calc(100% - 24px);
    max-width:680px;
    height:46px;

    display:flex;
    align-items:center;

    border:1px solid #ddd;
    background:#f7f7f7;
    border-radius:25px;

    padding-left:16px;
    padding-right:5px;
}

.home-search input{
    flex:1;
    min-width:0;

    border:0;
    outline:none;

    background:transparent;

    font-size:15px;
    color:#111;

    user-select:text;
    -webkit-user-select:text;
}

.home-search button{
    width:37px;
    height:37px;

    border:0;
    border-radius:50%;

    background:#111;
    color:#fff;

    font-size:17px;
}


/* =====================================================
   CATEGORIES
===================================================== */

.categories{
    display:flex;
    gap:8px;

    overflow-x:auto;
    scrollbar-width:none;

    padding:10px 14px 9px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;

    padding:8px 15px;

    border:0;
    border-radius:20px;

    background:#f0f0f0;
    color:#111;

    font-size:13px;
    font-weight:700;
}

.category.active{
    background:#111;
    color:#fff;
}


/* =====================================================
   HOME VIDEO LIST
===================================================== */

#results{
    width:100%;
    padding:5px 12px 25px;
}

.video-card{
    width:100%;
    margin-bottom:18px;
    cursor:pointer;
}

.video-thumb{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    overflow:hidden;

    border-radius:13px;

    background:#e9e9e9;
}

.video-thumb img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.video-title{
    margin-top:9px;

    font-size:15px;
    font-weight:700;
    line-height:1.35;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.video-channel{
    margin-top:5px;

    color:#777;
    font-size:12px;
}


/* =====================================================
   LOAD MORE
===================================================== */

#loadMore{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;
    font-size:13px;
}


/* =====================================================
   PLAYER PAGE
===================================================== */

#playerPage{
    display:none;

    min-height:100vh;

    background:#fff;

    padding-bottom:25px;
}


/* =====================================================
   PLAYER HEADER
===================================================== */

.player-header{
    position:sticky;
    top:0;
    z-index:5000;

    height:52px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

    color:#fff;
    background:#000;
}

.player-left{
    display:flex;
    align-items:center;
    min-width:0;
}

.player-back{
    width:40px;
    height:40px;

    border:0;
    background:transparent;

    color:#fff;
    font-size:31px;
}

.player-name{
    font-size:15px;
    font-weight:900;
    margin-left:2px;
}


/* =====================================================
   PLAYER ACTIONS
===================================================== */

.player-actions{
    display:flex;
    align-items:center;
    gap:4px;
}

.player-search-btn,
.player-demon-btn,
.player-rotate-btn{

    width:38px;
    height:38px;

    border:0;
    border-radius:50%;

    background:transparent;

    color:#fff;

    font-size:19px;
}

.player-demon-btn{
    font-size:21px;
}

.player-rotate-btn{
    font-size:23px;
}


/* =====================================================
   PLAYER SEARCH
===================================================== */

#playerSearchPanel{
    position:absolute;

    top:55px;
    right:10px;

    z-index:7000;

    width:min(390px,calc(100vw - 20px));

    display:none;

    padding:6px;

    background:rgba(255,255,255,.98);

    border:1px solid #ddd;
    border-radius:25px;

    box-shadow:0 8px 30px rgba(0,0,0,.2);
}

.player-search-inner{
    height:40px;

    display:flex;
    align-items:center;
}

#playerSearchInput{
    flex:1;
    min-width:0;

    height:100%;

    border:0;
    outline:none;

    background:transparent;

    padding:0 12px;

    font-size:14px;
    color:#111;

    user-select:text;
    -webkit-user-select:text;
}

#playerSearchSubmit{
    width:34px;
    height:34px;

    border:0;
    border-radius:50%;

    background:#111;
    color:#fff;
}


/* =====================================================
   STICKY VIDEO PLAYER
===================================================== */

#fullFrameHost{

    width:100%;

    background:#000;

    position:sticky;
    top:52px;

    z-index:4500;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 8px 28px rgba(0,0,0,.30);
}

#youtubeFrame{

    width:100%;

    aspect-ratio:16/9;

    height:auto;

    display:block;

    border:0;

    background:#000;
}


/* =====================================================
   FULLSCREEN VIDEO
===================================================== */

#fullFrameHost:fullscreen{

    width:100vw;
    height:100vh;

    position:fixed;

    inset:0;

    z-index:999999;

    border-radius:0;

    overflow:hidden;

    box-shadow:none;

    background:#000;

    display:flex;

    align-items:center;
    justify-content:center;
}

#fullFrameHost:-webkit-full-screen{

    width:100vw;
    height:100vh;

    position:fixed;

    inset:0;

    z-index:999999;

    border-radius:0;

    overflow:hidden;

    background:#000;

    display:flex;

    align-items:center;
    justify-content:center;
}

#fullFrameHost:fullscreen #youtubeFrame,
#fullFrameHost:-webkit-full-screen #youtubeFrame{

    width:100vw;
    height:100vh;

    aspect-ratio:auto;

    border:0;

    background:#000;
}


/* =====================================================
   MORE VIDEOS BUTTON
===================================================== */

#moreVideosButton{

    position:absolute;

    right:20px;
    bottom:22px;

    z-index:100;

    display:none;

    align-items:center;

    gap:10px;

    height:58px;

    padding:5px 7px 5px 18px;

    border:0;

    border-radius:30px;

    color:#fff;

    background:rgba(20,20,20,.78);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 6px 25px rgba(0,0,0,.45);

    font-family:Georgia,serif;

    font-size:19px;
    font-weight:700;
}

#moreVideosButton img{

    width:105px;
    height:48px;

    object-fit:cover;

    border-radius:24px;

    background:#333;
}


/*
   শুধুমাত্র fullscreen অবস্থায়
   More videos button দেখা যাবে
*/

#fullFrameHost:fullscreen #moreVideosButton,
#fullFrameHost:-webkit-full-screen #moreVideosButton{

    display:flex;
}


/* =====================================================
   MORE VIDEOS OVERLAY
===================================================== */

#moreVideosOverlay{

    position:absolute;

    inset:0;

    z-index:200;

    display:none;

    flex-direction:column;

    overflow:hidden;

    color:#fff;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.38),
            rgba(0,0,0,.88)
        );
}

#moreVideosOverlay.show{
    display:flex;
}


/* overlay header */

.more-overlay-header{

    height:72px;

    flex:0 0 72px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    font-family:Georgia,serif;
}

.more-overlay-title{

    font-size:25px;
    font-weight:900;

    text-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

.more-overlay-close{

    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:transparent;

    color:#fff;

    font-size:38px;
}


/* =====================================================
   MORE VIDEO TABS
===================================================== */

.more-tabs{

    flex:0 0 auto;

    display:flex;

    align-items:center;

    gap:34px;

    overflow-x:auto;

    scrollbar-width:none;

    padding:8px 28px 17px;

    font-family:Georgia,serif;
}

.more-tabs::-webkit-scrollbar{
    display:none;
}

.more-tab{

    flex:0 0 auto;

    border:0;

    background:transparent;

    color:#fff;

    font-size:18px;
    font-weight:700;

    white-space:nowrap;

    padding:10px 16px;

    border-radius:15px;
}

.more-tab.active{

    background:#fff;
    color:#111;
}


/* =====================================================
   MORE VIDEO GRID
===================================================== */

#moreVideosResults{

    flex:1;

    overflow-y:auto;

    padding:8px 28px 35px;

    scrollbar-width:none;
}

#moreVideosResults::-webkit-scrollbar{
    display:none;
}

.more-video-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:22px;

    align-items:start;
}

.more-card{

    min-width:0;

    cursor:pointer;

    font-family:Georgia,serif;
}

.more-card-thumb{

    position:relative;

    width:100%;

    aspect-ratio:16/9;

    overflow:hidden;

    border-radius:15px;

    background:#222;

    box-shadow:
        0 4px 15px rgba(0,0,0,.35);
}

.more-card-thumb img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.more-card-duration{

    position:absolute;

    right:8px;
    bottom:8px;

    padding:4px 7px;

    border-radius:7px;

    background:rgba(0,0,0,.72);

    color:#fff;

    font-family:Arial,sans-serif;

    font-size:11px;
}

.more-card-info{

    display:flex;

    gap:10px;

    padding-top:9px;
}

.more-card-avatar{

    width:34px;
    height:34px;

    flex:0 0 34px;

    border-radius:50%;

    object-fit:cover;

    background:#333;
}

.more-card-text{

    min-width:0;
}

.more-card-title{

    color:#fff;

    font-size:16px;
    font-weight:700;

    line-height:1.25;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.more-card-channel{

    margin-top:5px;

    color:#ccc;

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   RELATED
===================================================== */

.related{
    padding:9px 12px 30px;
}

.related-heading{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin:8px 0 12px;
}

#relatedTitle{

    font-size:19px;
    font-weight:900;
}

.related-clear{

    display:none;

    border:0;

    background:#f2f2f2;

    padding:7px 11px;

    border-radius:15px;

    font-size:11px;
}


/* =====================================================
   MINI BACKGROUND PLAYER
===================================================== */

#miniPlayer{

    position:fixed;

    left:10px;
    right:10px;

    bottom:76px;

    z-index:8500;

    display:none;

    align-items:center;

    padding:6px;

    background:#111;

    border-radius:13px;

    box-shadow:
        0 7px 30px rgba(0,0,0,.35);
}

#miniVideoHost{

    width:90px;
    min-width:90px;

    height:51px;

    overflow:hidden;

    border-radius:8px;

    background:#000;
}

#youtubeFrame.mini-frame{

    width:90px;
    height:51px;

    aspect-ratio:auto;

    display:block;

    border:0;
}

.mini-info{

    min-width:0;

    flex:1;

    padding:0 8px;

    cursor:pointer;
}

#miniTitle{

    color:#fff;

    font-size:12px;
    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

#miniClose{

    width:32px;
    height:32px;

    border:0;
    border-radius:50%;

    background:transparent;

    color:#fff;

    font-size:21px;
}


/* =====================================================
   HOME DEMON
===================================================== */

#homeDemon{

    position:fixed;

    right:15px;
    bottom:145px;

    z-index:8300;

    width:46px;
    height:46px;

    border:0;
    border-radius:50%;

    background:#111;

    color:#fff;

    font-size:23px;

    display:none;

    box-shadow:
        0 6px 22px rgba(0,0,0,.28);
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:9000;

    height:66px;

    background:rgba(255,255,255,.98);

    border-top:1px solid #e6e6e6;

    display:flex;

    align-items:center;
    justify-content:space-around;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.nav-btn{

    border:0;

    background:transparent;

    color:#555;

    font-size:11px;
    font-weight:700;
}

.nav-btn div{

    font-size:22px;
    line-height:23px;
}

.add-btn{

    width:49px;
    height:38px;

    border:0;
    border-radius:13px;

    background:#111;
    color:#fff;

    font-size:27px;
}


/* =====================================================
   BACKGROUND MENU
===================================================== */

#backgroundMenu{

    position:fixed;

    inset:0;

    z-index:10000;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:flex-end;
}

.background-panel{

    width:100%;

    padding:20px;

    background:#fff;

    border-radius:22px 22px 0 0;
}

.background-panel h3{

    margin:0 0 14px;

    font-size:18px;
}

.bg-option{

    width:100%;

    margin:5px 0;

    padding:13px;

    border:0;

    border-radius:12px;

    background:#f3f3f3;

    text-align:left;

    font-size:14px;
}


/* =====================================================
   STATUS
===================================================== */

.status{

    padding:35px 12px;

    text-align:center;

    color:#777;

    font-size:14px;
}


/* =====================================================
   DARK
===================================================== */

body.dark{

    background:#0b0b0b;
    color:#fff;
}

body.dark .home-header,
body.dark .bottom-nav{

    background:rgba(12,12,12,.98);
    border-color:#242424;
}

body.dark .home-search{

    background:#181818;
    border-color:#333;
}

body.dark .home-search input{

    color:#fff;
}

body.dark .category{

    background:#222;
    color:#ddd;
}

body.dark .category.active{

    background:#fff;
    color:#000;
}

body.dark .video-channel{

    color:#888;
}

body.dark #playerPage{

    background:#0b0b0b;
}

body.dark .background-panel{

    background:#151515;
}

body.dark .bg-option{

    background:#252525;
    color:#fff;
}

body.dark #playerSearchPanel{

    background:#171717;
    border-color:#333;
}

body.dark #playerSearchInput{

    color:#fff;
}

body.dark .related-clear{

    background:#222;
    color:#fff;
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation:landscape){

    #fullFrameHost:fullscreen #youtubeFrame,
    #fullFrameHost:-webkit-full-screen #youtubeFrame{

        width:100vw;
        height:100vh;

        object-fit:contain;
    }

}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-width:480px){

    .brand{
        font-size:22px;
    }

    #results,
    .related{

        padding-left:9px;
        padding-right:9px;
    }

    .video-title{

        font-size:14px;
    }

    .video-thumb{

        border-radius:11px;
    }

}


/* =====================================================
   LANDSCAPE MORE VIDEOS
===================================================== */

@media(max-width:900px) and (orientation:landscape){

    .more-overlay-header{

        height:55px;
        flex-basis:55px;

        padding:0 18px;
    }

    .more-overlay-title{

        font-size:20px;
    }

    .more-tabs{

        gap:15px;

        padding:
            2px 18px 10px;
    }

    .more-tab{

        font-size:14px;
        padding:7px 12px;
    }

    #moreVideosResults{

        padding:
            5px 18px 20px;
    }

    .more-video-grid{

        grid-template-columns:
            repeat(3,minmax(0,1fr));

        gap:14px;
    }

    .more-card-title{

        font-size:13px;
    }

    .more-card-avatar{

        width:28px;
        height:28px;

        flex-basis:28px;
    }

    #moreVideosButton{

        right:15px;
        bottom:15px;

        height:52px;

        font-size:17px;
    }

    #moreVideosButton img{

        width:88px;
        height:42px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     SPLASH
===================================================== -->

<div id="splashScreen">

    <img
        src="https://i.ibb.co.com/r2cGS8H4/1000012185.jpg"
        alt="JAWRA MUSIC"
        onerror="this.style.display='none'">

</div>


<!-- =====================================================
     HOME
===================================================== -->

<div id="app">

    <header class="home-header">

        <div class="brand">
            JAWRA <span>MUSIC</span>
        </div>

        <div class="home-search-wrap">

            <div class="home-search">

                <input
                    id="searchInput"
                    type="search"
                    autocomplete="off"
                    placeholder="Search music...">

                <button id="searchBtn">
                    🔍
                </button>

            </div>

        </div>


        <div class="categories">

            <button
                class="category active"
                data-query="trending music">
                Trending
            </button>

            <button
                class="category"
                data-query="Bangla songs">
                Bangla
            </button>

            <button
                class="category"
                data-query="Hindi songs">
                Hindi
            </button>

            <button
                class="category"
                data-query="English songs">
                English
            </button>

            <button
                class="category"
                data-query="Lofi music">
                Lofi
            </button>

            <button
                class="category"
                data-query="Remix songs">
                Remix
            </button>

        </div>

    </header>


    <main id="results">

        <div class="status">
            Loading JAWRA MUSIC...
        </div>

    </main>


    <div id="loadMore">
        Scroll for more
    </div>

</div>


<!-- =====================================================
     PLAYER
===================================================== -->

<section id="playerPage">

    <header class="player-header">

        <div class="player-left">

            <button
                class="player-back"
                id="playerBack">
                ‹
            </button>

            <div class="player-name">
                JAWRA MUSIC
            </div>

        </div>


        <div class="player-actions">

            <button
                class="player-search-btn"
                id="playerSearchBtn">
                🔍
            </button>

            <!-- ROTATE -->
            <button
                class="player-rotate-btn"
                id="playerRotateBtn"
                aria-label="Rotate">
                ⛶
            </button>

            <button
                class="player-demon-btn"
                id="playerDemonBtn">
                😈
            </button>

        </div>


        <div id="playerSearchPanel">

            <div class="player-search-inner">

                <input

/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   TITLE CLEAN
===================================================== */

function normalizeSongTitle(title){

    return String(title || "")
        .replace(
            /\b(official|video|audio|lyrics?|lyric|4k|hd|full|status|shorts?|song|songs|music)\b/gi,
            " "
        )
        .replace(
            /[^\u0980-\u09FFa-zA-Z0-9\s]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleArray(array){

    const arr =
        [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =====================================================
   YOUTUBE REQUEST
===================================================== */

async function youtubeRequest(params){

    const query = {

        key:API_KEY,

        part:"snippet",

        maxResults:
            params.maxResults || "20",

        type:"video",

        videoEmbeddable:"true",

        regionCode:"BD",

        relevanceLanguage:"bn",

        ...params

    };


    const url =
        API_URL +
        "?" +
        new URLSearchParams(query)
            .toString();


    const response =
        await fetch(url);


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data?.error?.message ||
            "YouTube API error"
        );

    }


    return data;

}

/* =====================================================
   REMOVE DUPLICATES
===================================================== */

function removeDuplicateVideos(
    items
){

    const seen =
        new Set();

    const output =
        [];

    for(
        const item of items
    ){

        const id =
            item?.id?.videoId;

        if(!id){
            continue;
        }


        /*
           Current video বাদ
        */

        if(
            id === currentVideoId
        ){

            continue;

        }


        if(
            seen.has(id)
        ){

            continue;

        }


        seen.add(id);

        output.push(item);

    }


    return output;

}


/* =====================================================
   SAME SONG CHECK
===================================================== */

function isSameSong(
    title
){

    const current =
        normalizeSongTitle(
            currentVideoTitle
        ).toLowerCase();


    const candidate =
        normalizeSongTitle(
            title
        ).toLowerCase();


    if(
        !current ||
        !candidate
    ){

        return false;

    }


    if(
        current === candidate
    ){

        return true;

    }


    const a =
        new Set(
            current
                .split(/\s+/)
                .filter(Boolean)
        );


    const b =
        new Set(
            candidate
                .split(/\s+/)
                .filter(Boolean)
        );


    if(
        !a.size ||
        !b.size
    ){

        return false;

    }


    let common = 0;


    a.forEach(
        function(word){

            if(b.has(word)){

                common++;

            }

        }
    );


    const similarity =
        common /
        Math.max(
            a.size,
            b.size
        );


    /*
       খুব বেশি একই title হলে
       একই গান হিসেবে বাদ
    */

    return similarity >= 0.72;

}


/* =====================================================
   40% RELATED + 60% MIXED
===================================================== */

async function buildMixedVideoList(
    query
){

    if(!hasApiKey()){

        return [];

    }


    /*
       40%:
       বর্তমান গান/গানের ধরন অনুযায়ী
    */

    const relatedQuery =
        normalizeSongTitle(
            query
        ) ||
        "music";


    /*
       60%:
       random mixed query
    */

    const mixedQueries = [

        "Bangla music shorts",
        "viral music shorts",
        "trending songs shorts",
        "Bangla viral video",
        "Hindi music shorts",
        "English music shorts",
        "new music shorts",
        "trending music",
        "lofi music",
        "remix music shorts",
        "viral songs",
        "popular music videos"

    ];


    /*
       প্রতি refresh-এ query বদলাবে
    */

    const randomIndex =
        Math.floor(
            Math.random() *
            mixedQueries.length
        );


    const mixedQuery =
        mixedQueries[
            (
                randomIndex +
                refreshSeed
            ) %
            mixedQueries.length
        ];


    try{

        const responses =
            await Promise.all([

                youtubeRequest({

                    q:
                        relatedQuery,

                    maxResults:"12"

                }),

                youtubeRequest({

                    q:
                        mixedQuery,

                    maxResults:"20"

                })

            ]);


        let relatedItems =
            responses[0].items || [];

        let mixedItems =
            responses[1].items || [];


        /*
           Current video বাদ
        */

        relatedItems =
            relatedItems.filter(
                function(item){

                    return (
                        item?.id?.videoId !==
                        currentVideoId
                    );

                }
            );


        mixedItems =
            mixedItems.filter(
                function(item){

                    return (
                        item?.id?.videoId !==
                        currentVideoId
                    );

                }
            );


        /*
           একই গান বাদ
        */

        relatedItems =
            relatedItems.filter(
                function(item){

                    return !isSameSong(
                        item?.snippet?.title
                    );

                }
            );


        mixedItems =
            mixedItems.filter(
                function(item){

                    return !isSameSong(
                        item?.snippet?.title
                    );

                }
            );


        /*
           Shuffle
        */

        relatedItems =
            shuffleArray(
                relatedItems
            );

        mixedItems =
            shuffleArray(
                mixedItems
            );


        /*
           40% related
           60% mixed

           মোট 20টি
        */

        const relatedCount =
            8;

        const mixedCount =
            12;


        const selectedRelated =
            relatedItems.slice(
                0,
                relatedCount
            );


        const selectedMixed =
            mixedItems.slice(
                0,
                mixedCount
            );


        let finalList =
            [
                ...selectedRelated,
                ...selectedMixed
            ];


        /*
           আবার shuffle,
           যাতে প্রথম 8টা সব related
           না দেখায়।
        */

        finalList =
            shuffleArray(
                finalList
            );


        /*
           Final duplicate remove
        */

        finalList =
            removeDuplicateVideos(
                finalList
            );


        return finalList;

    }
    catch(error){

        console.error(
            "Mixed list error:",
            error
        );

        return [];

    }

}

/* =====================================================
   SEARCH WHILE PLAYING
===================================================== */

async function searchWhilePlaying(){

    const q =
        playerSearchInput.value.trim();


    if(!q){
        return;
    }


    if(!hasApiKey()){
        return;
    }


    relatedTitle.textContent =
        "Search Results";


    relatedClear.style.display =
        "block";


    relatedResults.innerHTML = `
        <div class="status">
            Searching...
        </div>
    `;


    playerSearchPanel.style.display =
        "none";


    try{

        const data =
            await youtubeRequest({

                q:q,

                maxResults:"20"

            });


        renderVideos(
            data.items || [],
            relatedResults
        );

    }
    catch(error){

        relatedResults.innerHTML = `
            <div class="status">
                Search failed.
            </div>
        `;

    }

}

/* =====================================================
   UPDATE MORE PREVIEW
===================================================== */

function updateMorePreview(){

    const img =
        document.getElementById(
            "morePreviewImage"
        );


    if(
        !img ||
        !moreVideosData.length
    ){

        return;

    }


    const item =
        moreVideosData[0];


    const thumb =
        item?.snippet?.thumbnails?.high?.url ||
        item?.snippet?.thumbnails?.medium?.url ||
        item?.snippet?.thumbnails?.default?.url ||
        "";


    img.src =
        thumb;

}

document.querySelectorAll(
    ".bg-option"
).forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                const bg =
                    button.dataset.bg;


                document.getElementById(
                    "backgroundMenu"
                ).style.display =
                    "none";


                if(
                    bg === "black"
                ){

                    document.body.classList.add(
                        "dark"
                    );

                    document.body.style.background =
                        "#0b0b0b";

                }
                else{

                    document.body.classList.remove(
                        "dark"
                    );


                    if(
                        bg === "soft"
                    ){

                        document.body.style.background =
                            "#f7f7f7";

                    }
                    else if(
                        bg === "red"
                    ){

                        document.body.style.background =
                            "#fff1f1";

                    }
                    else{

                        document.body.style.background =
                            "#fff";

                    }

                }

            }
        );

    }
);


/* =====================================================
   WAKE LOCK
===================================================== */

async function requestWakeLock(){

    if(
        !("wakeLock" in navigator)
    ){

        return;

    }


    try{

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

    }
    catch(error){

        console.log(
            "Wake Lock unavailable"
        );

    }

}


async function releaseWakeLock(){

    if(!wakeLock){
        return;
    }


    try{

        await wakeLock.release();

    }
    catch(error){}


    wakeLock =
        null;

}


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible" &&
            playbackActive
        ){

            requestWakeLock();

        }

    }
);


/* =====================================================

===================================================== */

document.addEventListener(
    "touchmove",
    function(event){

        if(
            event.touches.length > 1
        ){

            event.preventDefault();

        }

    },
    {passive:false}
);


/* =====================================================
   DISABLE DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd =
    0;

document.addEventListener(
    "touchend",
    function(event){

        const now =
            Date.now();


        if(
            now - lastTouchEnd <=
            300
        ){

            event.preventDefault();

        }


        lastTouchEnd =
            now;

    },
    {passive:false}
);
